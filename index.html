<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Responsive Image Gallery</h1>

    <p>Thay đổi kích thước trình duyệt để xem hiệu ứng responsive.</p>

    <div class="gallery">
      <div class="gallery-item">
        <img src="img1.jpg" alt="Ảnh 1" />
        <div class="description">Hình ảnh 1</div>
      </div>

      <div class="gallery-item">
        <img src="img2.jpg" alt="Ảnh 2" />
        <div class="description">Hình ảnh 2</div>
      </div>

      <div class="gallery-item">
        <img src="img3.jpg" alt="Ảnh 3" />
        <div class="description">Hình ảnh 3</div>
      </div>

      <div class="gallery-item">
        <img src="img4.jpg" alt="Ảnh 4" />
        <div class="description">Hình ảnh 4</div>
      </div>
    </div>
  </body>
</html>
